name: Security checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm security:audit
      - run: pnpm exec vitest run --project unit --maxWorkers=2 tests/security.test.ts tests/xlsx-security.test.ts tests/env.test.ts tests/rate-limit.test.ts tests/inventory-excel.test.ts
