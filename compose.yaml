services:
  postgres:
    image: postgres:17-alpine
    container_name: turnero-fosa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: turnero_fosa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - turnero_fosa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turnero_fosa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  turnero_fosa_postgres_data:
